<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="This Orbit page could not be found. Return to release operations to continue.">
  <meta name="theme-color" content="#0c1118">
  <title>Page not found — Orbit</title>
  <style>
    :root { color-scheme: dark; font-family: "DM Sans", Inter, system-ui, sans-serif; color: #f4f7fb; background: #0c1118; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at 50% 20%, #25243d 0, #0c1118 58%); }
    main { width: min(100%, 540px); text-align: center; }
    .brand { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 48px; color: inherit; text-decoration: none; font-size: 20px; font-weight: 800; letter-spacing: -.6px; }
    .logo { display: grid; width: 32px; height: 32px; place-items: center; border-radius: 10px; background: #715cde; font-size: 17px; }
    .code { margin: 0; color: #c3b7ff; font-size: 13px; font-weight: 700; letter-spacing: .18em; }
    h1 { margin: 12px 0; font-size: clamp(34px, 8vw, 52px); line-height: 1.05; letter-spacing: -.045em; }
    .message { max-width: 400px; margin: 0 auto; color: #bdc7d4; font-size: 16px; line-height: 1.6; }
    .button { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; margin-top: 28px; padding: 0 18px; border: 1px solid #715cde; border-radius: 8px; background: #715cde; color: #fff; font: inherit; font-weight: 700; text-decoration: none; transition: filter .15s ease, transform .15s ease; }
    .button:hover { filter: brightness(1.12); transform: translateY(-1px); }
    .button:focus-visible { outline: 3px solid #c3b7ff; outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { .button { transition: none; } }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="./" aria-label="Orbit home"><span class="logo" aria-hidden="true">◉</span>Orbit</a>
    <p class="code">ERROR 404</p>
    <h1>Page not found</h1>
    <p class="message">This link may be out of date, or the page may have moved. Head back to Orbit and continue managing your releases.</p>
    <a class="button" href="./">Return to Orbit</a>
  </main>
</body>
</html>
